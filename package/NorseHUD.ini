; NorseHUD settings
; console: nhud.status | nhud.set <key> <value> (this session only) | nhud.reload (reads this file again)
[General]
; a compass at the top of the screen, as Skyrim's: N / E / S / W turning with the camera and a gold marker at the
; bearing of the current quest objective (the mission's destination) while it is within the compass's 180 degrees
bCompass=1
; its width and its distance from the top of the screen, in pixels
fCompassWidth=560
fCompassTop=14
; log detail: 0 trace, 1 debug, 2 info (the default), 3 warn, 4 error, 6 off - set 0 for a bug report
uLogLevel=2
; health bars over units, shown while the condition holds (NorseConditions language; empty = always)
bBars=1
sBarCondition=InFight AND NOT IsDead
fBarWidth=80
fBarHeight=7
; height above the unit's middle (its origin), in cm - 115 is just over the head
fBarZ=115
; no bars further than this from the hero, in cm
fMaxDistance=3500
; a bar at the top of the screen for a living boss in the fight (its unit type's bIsBoss)
bBossBar=1
; a marker over NorseRealtimeNative's lock-on target
bLockMarker=1
; the ability strip in real-time fights: LT + LB / X / Y / A / B with each ability's icon, cooldown and stamina state
; (needs NorseRealtimeNative); the game's turn-based ability bar is hidden meanwhile
bAbilityStrip=1
; one box's size and the strip's distance from the bottom of the screen, in pixels
fStripSize=64
fStripBottom=70
; where NorseHUD.log is written; empty = this folder
sLogDir=
